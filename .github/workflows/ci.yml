name: kabelweb CI

on:
  push:
  pull_request:

env:
  ZIG_VERSION: 0.16.0

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Diagnose system libs (Linux)
        if: runner.os == 'Linux'
        run: |
          for f in /usr/include/curl/curl.h /usr/include/openssl/ssl.h \
                   /usr/lib/libcurl.so /usr/lib/libssl.so /usr/lib/libcrypto.so \
                   /usr/include/x86_64-linux-gnu/curl/curl.h \
                   /usr/lib/x86_64-linux-gnu/libcurl.so \
                   /usr/lib/x86_64-linux-gnu/libssl.so \
                   /usr/lib/x86_64-linux-gnu/libcrypto.so; do
            if [ -f "$f" ]; then echo "  ok $f"; else echo "  MISSING $f"; fi
          done

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config openssl@3 curl

      - name: vcpkg baseline (Windows)
        if: runner.os == 'Windows'
        id: vcpkg-baseline
        shell: pwsh
        run: |
          $rev = ""
          if (Test-Path "C:\vcpkg\.git") {
            $rev = (git -C C:\vcpkg rev-parse HEAD 2>$null | Select-Object -First 1)
          }
          if (-not $rev -or $rev.Length -ne 40) {
            Write-Warning "C:\vcpkg has no readable git history -- keying the port cache to the image only"
            $rev = "nogit"
          }
          Write-Host "vcpkg baseline $rev"
          "rev=$rev" >> $env:GITHUB_OUTPUT

      - name: Restore the vcpkg cache (Windows)
        if: runner.os == 'Windows'
        id: vcpkg-cache
        # `restore` + `save` (not `cache`) so the exact key is written on the
        # first run and refreshed on later ones. Both the source tarballs and
        # the built binaries are cached: a cache hit needs NO download at all,
        # which is what removes the github.com/archive 503 that made PR #15's
        # Windows leg red (zlib 1.4, run 45534795579).
        uses: actions/cache/restore@v4
        with:
          path: |
            C:/vcpkg/downloads
            C:/vcpkg/archives
          key: vcpkg-x64-windows-curl-openssl-${{ steps.vcpkg-baseline.outputs.rev }}
          restore-keys: |
            vcpkg-x64-windows-curl-openssl-

      - name: Seed vcpkg source archives (Windows)
        if: runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # vcpkg's ports fetch sources from github.com/<repo>/archive/<ref>.tar.gz.
          # That endpoint intermittently answers 503 on hosted runners; the
          # codeload.github.com URL serves byte-identical tarballs. Seed them
          # into vcpkg's download cache and verify the SHA512 each port pins,
          # so a cold cache never depends on the flaky URL. When the runner
          # image advances its vcpkg baseline, these files simply stop matching
          # the new port versions and vcpkg downloads the new ones normally.
          $downloads = 'C:\vcpkg\downloads'
          New-Item -ItemType Directory -Force -Path $downloads | Out-Null
          $archives = @(
            @{
              Name = 'madler-zlib-v1.4.tar.gz'
              Url  = 'https://codeload.github.com/madler/zlib/tar.gz/refs/tags/v1.4'
              Sha  = '67f3ce120210a69aa05cece6f76d5f45b50d947c095169f0d699732d0182d7d04aec1af56a3fc6bbcc2af91a57e099cd73980b17f7d96ad90aeabbeaafbf1cbc'
            },
            @{
              Name = 'curl-curl-curl-8_23_0.tar.gz'
              Url  = 'https://codeload.github.com/curl/curl/tar.gz/refs/tags/curl-8_23_0'
              Sha  = 'e1003f374675a6ae50463995a6c705208c4247120093f1fcccf030847161235b3dfc0e40927114ccbc5b4530893990ccb96ec15400ffe4bcb275d26a0499f10e'
            },
            @{
              Name = 'openssl-openssl-openssl-3.6.5.tar.gz'
              Url  = 'https://codeload.github.com/openssl/openssl/tar.gz/refs/tags/openssl-3.6.5'
              Sha  = '40f0b346a9a5cf4cb37f1ecebdc74750c39a95783710061bfac58964883b0831543ecee0aee9f747ea093781b13c58a543b0b935d222519e3cb19648d77a0276'
            }
          )
          foreach ($archive in $archives) {
            $path = Join-Path $downloads $archive.Name
            if (-not (Test-Path $path)) {
              Write-Host "seeding $($archive.Name) from $($archive.Url)"
              try {
                Invoke-WebRequest -Uri $archive.Url -OutFile $path
              } catch {
                Remove-Item -Force $path -ErrorAction SilentlyContinue
                throw
              }
            }
            $actual = (Get-FileHash -Algorithm SHA512 -Path $path).Hash.ToLowerInvariant()
            if ($actual -ne $archive.Sha) {
              Remove-Item -Force $path
              throw "vcpkg source archive $($archive.Name) failed SHA512 verification"
            }
            Write-Host "ok $($archive.Name)"
          }

      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VCPKG_DOWNLOADS = 'C:\vcpkg\downloads'
          # --binarysource makes the restored C:/vcpkg/archives the package
          # cache: on a hit vcpkg extracts the ports instead of rebuilding
          # them (8-10 min -> seconds) and never touches the network.
          & C:\vcpkg\vcpkg.exe install --recurse --binarysource="files,C:/vcpkg/archives,readwrite" curl:x64-windows openssl:x64-windows
          if ($LASTEXITCODE -ne 0) {
            Write-Error "vcpkg install failed with exit code $LASTEXITCODE"
            exit 1
          }
          # Runtime DLLs (libcurl.dll, libssl-3-x64.dll, ...) must be on
          # PATH or the test binary aborts before main() runs.
          "C:\vcpkg\installed\x64-windows\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Save the vcpkg cache (Windows)
        if: runner.os == 'Windows' && !cancelled() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        # Runs even if a later step fails: whatever vcpkg managed to fetch or
        # build is still worth keeping. A cache entry is immutable, so an
        # exact-key hit skips the upload.
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            C:/vcpkg/downloads
            C:/vcpkg/archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: zig build --summary all

      - name: Test server suites
        # Split from client suites so a hanging suite is localized to
        # one half. Bounded so a hang fails fast with logs instead of
        # burning the runner limit with zero output.
        timeout-minutes: 30
        run: zig build test-server --summary all

      - name: Test client suites
        timeout-minutes: 30
        run: zig build test-client --summary all

  # The Windows client, through the VENDORED archive, built and then actually
  # RUN against a real server.
  #
  # The `test` job above links vcpkg's curl on Windows, so it never touches
  # `vendor/curl/windows-amd64/` — which is how that archive could rot unnoticed.
  # This job does the opposite: no vcpkg, `-Dforce-vendor=true` (skip the system
  # probe) and `-Drequire-real-curl=true` (a missing archive is a hard error, not
  # a no-op stub). The binary it produces is then executed against a local HTTP
  # server and against a public HTTPS endpoint, so "it links" is not the claim —
  # "it sends" is.
  windows-vendored-curl:
    name: windows-vendored-curl
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: The archive is in the repo (and the script that rebuilds it)
        shell: bash
        run: |
          set -euo pipefail
          ls -l vendor/curl/windows-amd64/lib/libcurl.a
          ls vendor/curl/windows-amd64/include/curl/curl.h
          test -x scripts/build-vendor-curl-windows.sh || test -f scripts/build-vendor-curl-windows.sh

      - name: Build the client against the vendored archive (no stub allowed)
        shell: bash
        run: zig build client-smoke -Dforce-vendor=true -Drequire-real-curl=true --summary all

      - name: It must FAIL if the archive is gone (the stub gate works)
        shell: bash
        # `-Dvendor-dir` points at an empty directory, so the build has to
        # refuse. A green build here would mean the stub silently took over.
        run: |
          set +e
          zig build client-smoke -Dforce-vendor=true -Drequire-real-curl=true \
            -Dvendor-dir=vendor/does-not-exist > stub-gate.log 2>&1
          rc=$?
          set -e
          cat stub-gate.log | tail -5
          test "$rc" -ne 0 || { echo "::error::require-real-curl did not reject the stub path"; exit 1; }
          grep -q "refusing to fall back to the no-op stub" stub-gate.log

      - name: Send a real request over HTTP (local server)
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8123 --bind 127.0.0.1 &
          server=$!
          sleep 2
          ./zig-out/bin/kabelweb-client-smoke.exe GET http://127.0.0.1:8123/
          kill $server

      - name: Send a real request over HTTPS (Schannel + the system cert store)
        shell: bash
        # Retried twice: a flaky runner network must not be confused with a
        # broken TLS stack. A stubbed build fails all three attempts, always.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./zig-out/bin/kabelweb-client-smoke.exe GET https://example.com/; then
              echo "https ok on attempt $attempt"
              exit 0
            fi
            echo "https attempt $attempt failed"
            sleep 3
          done
          echo "::error::the vendored Windows libcurl could not complete an HTTPS request"
          exit 1

  soak:
    name: soak (ubuntu, 60s SSE soaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Test (fast suites + 60s SSE soaks)
        timeout-minutes: 30
        run: zig build test --summary all
